name: Test GitHub Profile 3D Contrib

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Only run when manually launched against workflow-test
    if: github.ref == 'refs/heads/update_p'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v5
        with:
          ref: update_p

      - name: Generate 3D contribution profile
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated files to test branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add profile-3d-contrib/
          git diff --cached --quiet || git commit -m "Test: update 3D contribution profile"
          git push origin HEAD:update_p